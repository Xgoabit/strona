<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona internetowa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        
        /* Ekran startowy z czerwonym przyciskiem */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            z-index: 20;
            cursor: pointer;
        }
        #start-screen img {
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #start-screen img:hover {
            transform: scale(1.05);
        }
        #start-screen p {
            color: white;
            font-family: sans-serif;
            font-size: 22px;
            margin-top: 20px;
        }

        /* Właściwy ekran wirusa w tle */
        #virus-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: #000;
            cursor: none !important; 
            z-index: 1;
        }
        #bg-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            pointer-events: none;
            cursor: none !important;
        }

        /* Latające okienko HACKED (fakevirushacked.png) */
        #floating-box {
            position: fixed;
            width: 280px; 
            z-index: 10;
            display: none;
            pointer-events: none;
        }
        #floating-box img {
            width: 100%;
            display: block;
            filter: drop-shadow(0px 0px 15px red);
        }

        /* Okno z paskiem postępu i zegarem śmierci */
        #progress-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 0, 0, 0.95);
            border: 2px solid red;
            padding: 30px;
            border-radius: 8px;
            z-index: 100;
            display: none;
            text-align: center;
            color: white;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            pointer-events: none;
            width: 480px;
        }
        #progress-container h2 {
            color: red;
            margin-bottom: 10px;
            font-size: 20px;
            text-transform: uppercase;
        }
        #countdown-timer {
            font-size: 28px;
            color: #ff3333;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px red;
        }
        #progress-bar-bg {
            width: 100%;
            background: #333;
            height: 22px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #555;
            margin-top: 10px;
        }
        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: red;
            transition: width 0.2s linear;
        }
        #progress-text {
            margin-top: 8px;
            font-size: 13px;
            color: #ffcccc;
        }

        /* Symulacja nagrywania z kamery (REC) */
        #webcam-sim {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid red;
            padding: 10px 15px;
            border-radius: 5px;
            color: white;
            z-index: 100;
            display: none;
            font-size: 14px;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        #rec-dot {
            width: 12px;
            height: 12px;
            background-color: red;
            border-radius: 50%;
            box-shadow: 0 0 8px red;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* Fałszywy, szalejący kursor myszy */
        #fake-cursor {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="red" stroke="white" stroke-width="1.5"><polygon points="5.5,3 5.5,21 10.5,16 16,21 18,19 12.5,14 19,14"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 99999;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body style="cursor: none !important;">

    <!-- Ekran startowy z czerwonym przyciskiem -->
    <div id="start-screen" onclick="triggerPrank()">
        <img src="redbutton.png" alt="Czerwony Przycisk" onerror="alert('Błąd: Brak pliku redbutton.png w folderze!');">
        <p>Kliknij tu żeby przejsc dalej</p>
    </div>

    <!-- Ekran wirusa w tle -->
    <div id="virus-screen">
        <img id="bg-image" src="fakewirus.png" alt="Fake Virus Screen" onerror="alert('Błąd: Brak pliku fakewirus.png w folderze!');">
    </div>

    <!-- Latające okienko HACKED -->
    <div id="floating-box">
        <img src="fakevirushacked.png" alt="Hacked Box" onerror="alert('Błąd: Brak pliku fakevirushacked.png w folderze!');">
    </div>

    <!-- Symulacja nagrywania kamerki -->
    <div id="webcam-sim">
        <div id="rec-dot"></div>
        <span>REC [KAMERA 1: AKTYWNA]</span>
    </div>

    <!-- Pasek postępu i zegar śmierci -->
    <div id="progress-container">
        <h2>⚠️ KRYTYCZNY BŁĄD SYSTEMU ⚠️</h2>
        <div id="countdown-timer">Zablokowanie dysku za: 00:45</div>
        <div id="progress-status">Usuwanie danych konta i plików systemowych...</div>
        <div id="progress-bar-bg">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-text">Postęp: 0%</div>
    </div>

    <!-- Samoruchoma czerwona strzałka myszy -->
    <div id="fake-cursor"></div>

    <!-- Dźwięk alarmu -->
    <audio id="alarm-sound" loop preload="auto">
        <source src="fakewirussound.mp3" type="audio/mpeg">
        Twoja przeglądarka nie obsługuje audio.
    </audio>

    <script>
        const sound = document.getElementById('alarm-sound');
        const startScreen = document.getElementById('start-screen');
        const virusScreen = document.getElementById('virus-screen');
        const floatingBox = document.getElementById('floating-box');
        const progressContainer = document.getElementById('progress-container');
        const webcamSim = document.getElementById('webcam-sim');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressText = document.getElementById('progress-text');
        const progressStatus = document.getElementById('progress-status');
        const countdownTimer = document.getElementById('countdown-timer');
        const fakeCursor = document.getElementById('fake-cursor');

        // Fizyka latającego okienka
        let posX = 150, posY = 150;
        let speedX = 5;
        let speedY = 5;

        function triggerPrank() {
            // 1. Uruchomienie dźwięku
            sound.play().catch(err => {
                console.log("Audio zablokowane:", err);
            });

            // 2. Pokazanie elementów żartu
            startScreen.style.display = 'none';
            virusScreen.style.display = 'block';
            floatingBox.style.display = 'block';
            progressContainer.style.display = 'block';
            webcamSim.style.display = 'flex';
            fakeCursor.style.display = 'block';
            document.body.style.cursor = 'none';

            // 3. Uruchomienie animacji, zegara i funkcji paniki
            requestAnimationFrame(animateDVD);
            startCrazyCursor();
            startProgressBar();
            startCountdown();
            startErrorSpam();

            // 4. Wymuszenie pełnego ekranu
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        }

        // Odbijanie się okienka HACKED od ścian
        function animateDVD() {
            posX += speedX;
            posY += speedY;

            const boxWidth = floatingBox.clientWidth || 280;
            const boxHeight = floatingBox.clientHeight || 150;

            if (posX <= 0 || posX + boxWidth >= window.innerWidth) {
                speedX = -speedX;
            }
            if (posY <= 0 || posY + boxHeight >= window.innerHeight) {
                speedY = -speedY;
            }

            floatingBox.style.left = posX + 'px';
            floatingBox.style.top = posY + 'px';

            requestAnimationFrame(animateDVD);
        }

        // Tykający zegar śmierci
        function startCountdown() {
            let timeLeft = 45; // 45 sekund
            const timerInterval = setInterval(() => {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownTimer.innerText = `Zablokowanie dysku za: 00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    countdownTimer.innerText = "⚠️ DYSK ZOSTALI ZABLOKOWANY! ⚠️";
                }
            }, 1000);
        }

        // Symulacja paska postępu usuwania danych
        function startProgressBar() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 3) + 1;
                if (progress >= 100) {
                    progress = 100;
                    progressBarFill.style.width = '100%';
                    progressText.innerText = 'Postęp: 100%';
                    progressStatus.innerText = '⚠️ DANE ZOSTAŁY USUNIĘTE! ⚠️';
                    clearInterval(interval);
                } else {
                    progressBarFill.style.width = progress + '%';
                    progressText.innerText = 'Postęp: ' + progress + '%';
                    
                    if (progress > 70) {
                        progressStatus.innerText = 'Usuwanie haseł i plików sesji...';
                    } else if (progress > 40) {
                        progressStatus.innerText = 'Kopiowanie danych na zewnętrzny serwer...';
                    }
                }
            }, 400);
        }

        // Lawina wyskakujących okienek z błędami (alertów)
        function startErrorSpam() {
            const errorMessages = [
                "Błąd krytyczny: Utracono połączenie z systemem plików!",
                "Uwaga! Wykryto nieznanego wirusa trojan.exe",
                "Ostrzeżenie: Próba kradzieży danych logowania!",
                "Karta graficzna przestała odpowiadać i zresetowała się.",
                "Błąd pamięci RAM: Odczyt niemożliwy (0x00000FF)"
            ];

            setInterval(() => {
                const randomMsg = errorMessages[Math.floor(Math.random() * errorMessages.length)];
                alert(randomMsg);
            }, 4000);
        }

        // Szalejący fałszywy kursor myszy
        function startCrazyCursor() {
            setInterval(() => {
                const randomX = Math.random() * (window.innerWidth - 60);
                const randomY = Math.random() * (window.innerHeight - 60);
                fakeCursor.style.left = randomX + 'px';
                fakeCursor.style.top = randomY + 'px';
            }, 70);
        }

        // Blokada klawiszy
        document.addEventListener('keydown', function(event) {
            if (virusScreen.style.display === 'block') {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
