<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        /* Ekran startowy z czerwonym przyciskiem */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            z-index: 20;
            cursor: pointer;
        }
        #start-screen img {
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #start-screen img:hover {
            transform: scale(1.05);
        }
        #start-screen p {
            color: white;
            font-family: sans-serif;
            font-size: 22px;
            margin-top: 20px;
        }

        /* Właściwy ekran wirusa (ukryty na start) */
        #virus-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: #000;
            pointer-events: none; /* Blokuje interakcję myszką znajomego */
        }
        #bg-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* Samoruchomy kursor myszy */
        #fake-cursor {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="red" stroke="white" stroke-width="1.5"><polygon points="5.5,3 5.5,21 10.5,16 16,21 18,19 12.5,14 19,14"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 99999;
            display: none;
            pointer-events: none;
            transition: top 0.08s ease-out, left 0.08s ease-out; /* Płynny ruch */
        }
    </style>
</head>
<body>

    <!-- Ekran startowy z czerwonym przyciskiem -->
    <div id="start-screen" onclick="triggerPrank()">
        <img src="redbutton.png" alt="Czerwony Przycisk" onerror="alert('Błąd: Brak pliku redbutton.png w folderze!');">
        <p>Kliknij tu żeby przejsc dalej</p>
    </div>

    <!-- Ekran wirusa -->
    <div id="virus-screen">
        <img id="bg-image" src="fakewirus.png" alt="Fake Virus Screen" onerror="alert('Błąd: Brak pliku fakewirus.png w folderze!');">
    </div>

    <!-- Samoruchoma czerwona strzałka myszy -->
    <div id="fake-cursor"></div>

    <!-- Dźwięk alarmu -->
    <audio id="alarm-sound" loop preload="auto">
        <source src="fakewirussound.mp3" type="audio/mpeg">
        Twoja przeglądarka nie obsługuje audio.
    </audio>

    <script>
        const sound = document.getElementById('alarm-sound');
        const startScreen = document.getElementById('start-screen');
        const virusScreen = document.getElementById('virus-screen');
        const fakeCursor = document.getElementById('fake-cursor');

        function triggerPrank() {
            // 1. Uruchomienie dźwięku
            sound.play().catch(err => {
                console.log("Audio zablokowane:", err);
            });

            // 2. Pokazanie ekranu wirusa i włączenie fałszywego kursora
            startScreen.style.display = 'none';
            virusScreen.style.display = 'block';
            fakeCursor.style.display = 'block';

            // 3. Uruchomienie szalejącego kursora
            startCrazyCursor();

            // 4. Przejście w tryb pełnoekranowy
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        }

        function startCrazyCursor() {
            setInterval(() => {
                // Losowa pozycja na ekranie
                const randomX = Math.random() * (window.innerWidth - 50);
                const randomY = Math.random() * (window.innerHeight - 50);

                fakeCursor.style.left = randomX + 'px';
                fakeCursor.style.top = randomY + 'px';
            }, 100); // Kursor zmienia pozycję co 0.1 sekundy, płynnie sunąc po ekranie
        }
    </script>
</body>
</html>
